[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".git",
    ".github",
    ".venv",
    "__pycache__",
    "lichess_downloaded",
    "lichess_pgns",
    "twic_downloaded",
    "twic_pgns",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line-too-long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
