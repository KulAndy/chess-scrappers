[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-scrappers"
version = "1.0.0"
requires-python = ">=3.12"
authors = [
  {name = "Andrzej Kulesza", email = "andykrk22@gmail.com"},
]
description = "Chess pgn scrappers for chessarbiter, chessmanager, chess-results, media idchess and brodcast: chessbase and lichess"
readme = "README.md"

dependencies = [
    "attrs==26.1.0",
    "beautifulsoup4==4.15.0",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.0",
    "chess==1.11.2",
    "h11==0.16.0",
    "idna==3.18",
    "lxml==6.1.1",
    "outcome==1.3.0.post0",
    "packaging==26.3",
    "PyInputPlus==0.2.12",
    "PySimpleValidate==0.2.12",
    "PySocks==1.7.1",
    "requests==2.34.2",
    "selenium==4.47.0",
    "sniffio==1.3.1",
    "sortedcontainers==2.4.0",
    "soupsieve==2.9.2",
    "stdiomask==0.0.6",
    "trio==0.34.0",
    "trio-websocket==0.12.2",
    "types-selenium==3.141.9",
    "typing_extensions==4.16.0",
    "undetected-chromedriver==3.5.5",
    "Unidecode==1.4.0",
    "urllib3==2.7.0",
    "websocket-client==1.9.0",
    "websockets==17.0.1",
    "wsproto==1.3.2",
    "zstandard==0.25.0",
]

[project.optional-dependencies]
dev = [
    "ast_serialize==0.8.0",
    "librt==0.15.0",
    "mypy==2.3.1",
    "mypy_extensions==1.1.0",
    "pathspec==1.1.1",
    "ruff==0.16.3"
]

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".git",
    ".github",
    ".venv",
    "__pycache__",
    "lichess_downloaded",
    "lichess_pgns",
    "twic_downloaded",
    "twic_pgns",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM",  # flake8-simplify\
    "RET",  # flake8-return
]
ignore = [
    "E501",  # line-too-long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true

check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true

no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

ignore_missing_imports = true